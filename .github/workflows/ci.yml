name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dbt project
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SNOWFLAKE_ACCOUNT: placeholder-account
      SNOWFLAKE_USER: placeholder_user
      SNOWFLAKE_PASSWORD: placeholder_password
      SNOWFLAKE_SCHEMA: DBT_CI_PARSE

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CI profile
        run: cp profiles.example.yml profiles.yml

      - name: Install dev test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Validate source contracts
        run: |
          .venv/bin/pytest tests/lending tests/source_contracts -q
          .venv/bin/python scripts/validate_source_contracts.py

      - name: Build dbt image
        run: docker compose build

      - name: Install dbt packages
        run: docker compose run --rm dbt deps

      - name: Generate scale lending parquet
        run: docker compose run --rm --entrypoint python dbt scripts/generate_lending_data.py --scale 20 --seed 7

      - name: Parse DuckDB and Snowflake targets
        run: |
          docker compose run --rm dbt parse
          docker compose run --rm dbt parse --target snowflake_dev
          docker compose run --rm dbt parse --target prod

      - name: Create relations for unit-test schema inference
        run: |
          docker compose run --rm dbt seed
          docker compose run --rm dbt run --empty

      - name: Run focused unit tests
        run: docker compose run --rm dbt test --select resource_type:unit_test

      - name: Download state manifest
        id: state
        shell: bash
        run: |
          mkdir -p ci-state
          download_manifest() {
            local branch="$1"
            local artifact="$2"
            local run_id
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch "$branch" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]] && gh run download "$run_id" \
              --name "$artifact" \
              --dir ci-state; then
              return 0
            fi
            return 1
          }

          # A pull request compares with its base branch when that branch has
          # published a manifest. That is what makes a versioned contract break
          # fail here. main remains the fallback, including its older artifact name.
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
            && download_manifest "${{ github.base_ref }}" dbt-manifest; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif download_manifest main dbt-manifest \
            || download_manifest main dbt-main-manifest; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful state manifest is available; skipping state selection."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build modified nodes and dependencies
        if: steps.state.outputs.available == 'true'
        run: docker compose run --rm dbt build --select "+state:modified+" --state ci-state --exclude resource_type:test

      - name: Run complete local build and data tests
        run: docker compose run --rm dbt build

      - name: Validate semantic contract
        run: make semantic-validate

      - name: Test governance gate
        run: .venv/bin/pytest tests/governance -q

      - name: Validate governance quality gate
        run: make governance-check PYTHON=.venv/bin/python

      - name: Evidence — removing meta.owner fails OWN-01
        run: .venv/bin/python tests/governance/expect_own01.py

      - name: Publish manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish main manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-main-manifest
          path: target/manifest.json
          retention-days: 30
          if-no-files-found: error
