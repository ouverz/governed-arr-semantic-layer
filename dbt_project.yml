name: arr_semantic_layer_lab
version: 1.0.0
config-version: 2

profile: arr_semantic_layer_lab

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

vars:
  arr_fixture_history_start_date: "2025-01-01"
  arr_fixture_reporting_start_date: "2025-01-01"
  arr_fixture_reporting_end_date: "2025-06-30"
  arr_paused_subscription_exclusion_start_date: "2025-04-01"
  arr_prod_history_start_date: "2020-01-01"
  arr_prod_reporting_start_date: "2021-01-01"
  # Days after month-end during which a recorded posting still counts.
  # 5 includes the 4 April posting on LN_LATE_POSTED, so 31 March is current.
  loan_knowledge_cutoff_days: 5

models:
  arr_semantic_layer_lab:
    +meta:
      owner: Data
    staging:
      +materialized: view
      +schema: staging
      +access: private
      +group: revenue
      lending:
        +group: lending
    intermediate:
      +materialized: view
      +schema: intermediate
      +access: private
      +group: revenue
      lending:
        +group: lending
    data_quality:
      +materialized: view
      +schema: data_quality
      +tags: ["data_quality"]
      +access: private
      +group: revenue
    marts:
      +materialized: table
      +schema: marts
      +access: public
      +group: revenue
      core:
        +group: platform
      lending:
        +group: lending
    snowflake_semantic:
      +schema: semantic
      +tags: ["snowflake_semantic"]
      +access: protected
      +group: revenue

# Singular tests and generic tests must share the group of any private model
# they select. Lending tests need their own +group override under this key.
data_tests:
  arr_semantic_layer_lab:
    +group: revenue

seeds:
  arr_semantic_layer_lab:
    +schema: raw
    lending:
      +group: lending
