version: 2

models:
  - name: metricflow_time_spine
    description: >
      Daily time spine required by the dbt semantic layer. The local fixture
      range is fixed; production begins before the reporting range and advances
      through the current date unless an explicit end date is supplied.
      The model name is a dated NAM-01 exception.
    config:
      access: public
      group: platform
      contract:
        enforced: true
      meta:
        owner: Data
        business_owner: Data
        tier: supporting
        grain: date_day
        freshness_sla: "lab: daily spine rebuilt with the fixture window"
        primary_key:
          - date_day
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: One calendar day in the configured history-through-reporting range.
        data_type: date
        granularity: day
        data_tests: [not_null, unique]

  - name: dim_account
    description: >
      Current account attributes approved for Ending ARR slicing. This is the
      Salesforce account, not a conformed customer dimension, and it is not
      historical.
    config:
      access: public
      group: revenue
      contract:
        enforced: true
      meta:
        owner: Data
        business_owner: RevOps
        tier: supporting
        grain: account_id (current state)
        freshness_sla: "lab: current-state fixture, rebuilt on demand"
        primary_key:
          - account_id
    columns:
      - name: account_id
        description: >
          Salesforce account identifier. customer_id is the conformed key
          when a model needs one.
        data_type: varchar
        config:
          meta:
            key_role: salesforce_account
        data_tests: [not_null, unique]
      - name: account_name
        description: Display name of the account.
        data_type: varchar
        data_tests: [not_null]
      - name: segment
        description: Current commercial segment.
        data_type: varchar
        data_tests: [not_null]
      - name: region
        description: Current commercial region.
        data_type: varchar
        data_tests: [not_null]

  - name: dim_date
    description: >
      Approved calendar month-end snapshot dates, including pre-reporting
      history used to classify movements correctly.
    config:
      access: public
      group: platform
      contract:
        enforced: true
      meta:
        owner: Data
        business_owner: Data
        tier: supporting
        grain: snapshot_date
        freshness_sla: "lab: month-end dates from the fixture window"
        primary_key:
          - snapshot_date
    columns:
      - name: snapshot_date
        description: Calendar month-end date.
        data_type: date
        data_tests: [not_null, unique]

  - name: dim_customer
    description: >
      Conformed customer for the ARR and lending products. customer_id is
      one-to-one with the Salesforce account_id in this lab. The map is
      C plus the numeric part of the account id. Attributes are current-state
      and are not a point-in-time history.
    config:
      access: public
      group: platform
      contract:
        enforced: true
      meta:
        owner: Data
        business_owner: Data
        tier: supporting
        grain: customer_id
        freshness_sla: "lab: current-state fixture, rebuilt on demand"
        primary_key:
          - customer_id
    columns:
      - name: customer_id
        description: Conformed customer key. One Salesforce account maps to one customer in this lab.
        data_type: varchar
        config:
          meta:
            key_role: conformed_customer
        data_tests: [not_null, unique]
      - name: account_id
        description: Salesforce account this customer is mapped from.
        data_type: varchar
        config:
          meta:
            key_role: salesforce_account
        data_tests: [not_null, unique]
      - name: account_name
        description: Current account name. Not a historical attribute.
        data_type: varchar
        data_tests: [not_null]
      - name: segment
        description: Current commercial segment. Not a historical attribute.
        data_type: varchar
        data_tests: [not_null]
      - name: region
        description: Current commercial region. Not a historical attribute.
        data_type: varchar
        data_tests: [not_null]

  - name: dim_product
    description: >
      Product catalog for subscription products and SME credit products.
      product_line separates the two. Credit product ids are the lending
      product_id values. Subscription product ids are the Salesforce product ids.
    config:
      access: public
      group: platform
      contract:
        enforced: true
      meta:
        owner: Data
        business_owner: Data
        tier: supporting
        grain: product_id
        freshness_sla: "lab: current catalog, rebuilt on demand"
        primary_key:
          - product_id
    columns:
      - name: product_id
        description: Product identifier. Salesforce product id or a lending product id.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: product_name
        description: Display name.
        data_type: varchar
        data_tests: [not_null]
      - name: product_family
        description: Family used by ARR for subscription products. Credit products use Credit.
        data_type: varchar
        data_tests: [not_null]
      - name: product_line
        description: subscription or credit.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [subscription, credit]
      - name: charge_type
        description: How the product bills. Credit uses instalment or revolving.
        data_type: varchar
        data_tests: [not_null]
